# Axion relocation: canonical package/resource paths; training behavior unchanged.
# DeepResearch tools configuration -- NO-SEARCH variant.
# Same as tools.yaml but with the `search` (Serper) and `google_scholar` (Serper)
# tools REMOVED, so a run spends ZERO Serper API credit. Only PythonInterpreter
# and visit remain. Rollouts can't research the web -> data is not meaningful;
# use this only for cheap mechanics validation (keep-warm / 9B judge / pipeline),
# not for real training. Point the run at it via TOOL_CONFIG_PATH.

tools:
  - class_name: axion.training.rl.tools.python_tool.DeepResearchPythonTool
    config:
      type: native
      backend: ${oc.env:PYTHON_SANDBOX_BACKEND,sandbox_fusion}
      python_nodes_conf: ${oc.env:PYTHON_NODES_CONF,axion/training/rl/config/python_nodes.conf}
      # Also the E2B sandbox lifetime (sandbox_timeout=min(timeout,300)); 50->120
      # so sandboxes don't expire mid-trajectory and 404 under contention.
      timeout: 120
      max_retries: 5
    tool_schema:
      type: function
      function:
        name: PythonInterpreter
        description: "Executes Python code in a sandboxed environment. To use this tool, you must follow this format:\n1. The 'arguments' JSON object must be empty: {}.\n2. The Python code to be executed must be placed immediately after the JSON block, enclosed within <code> and </code> tags.\n\nIMPORTANT: Any output you want to see MUST be printed to standard output using the print() function.\n\nExample of a correct call:\n<tool_call>\n{\"name\": \"PythonInterpreter\", \"arguments\": {}}\n<code>\nimport numpy as np\n# Your code here\nprint(f\"The result is: {np.mean([1,2,3])}\")\n</code>\n</tool_call>"
        parameters:
          type: object
          properties: {}
          required: []

  - class_name: axion.training.rl.tools.visit_tool.DeepResearchVisitTool
    config:
      type: native
      jina_api_key: ${oc.env:JINA_API_KEY,""}
      timeout: 50
      max_content_length: 100000
      cache_enabled: true
      cache_resume: true
      cache_dir: ${oc.env:VISIT_CACHE_DIR,axion/training/rl/database}
      cache_file: ${oc.env:VISIT_CACHE_FILE,axion/training/rl/database/visit.db}
      cache_shards: 16
      cache_auto_shard: true
      cache_auto_merge: true
      cache_shard_leader: null
      api_key: ""
      api_base: ""
      azure_endpoint: ""
      azure_api_version: ""
      azure_deployment: ""
      summary_model_name: ""
    tool_schema:
      type: function
      function:
        name: visit
        description: "Visit webpage(s) and return the summary of the content."
        parameters:
          type: object
          properties:
            url:
              type: array
              items:
                type: string
              description: "The URL(s) of the webpage(s) to visit."
            goal:
              type: string
              description: "The specific information goal for visiting the webpage."
          required:
            - url
            - goal
