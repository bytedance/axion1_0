# Lint settings for this project's own code. The vendored third-party trees
# keep their upstream style and are excluded.

line-length = 100
target-version = "py312"

exclude = [
    "train/verl",
    "train/sft/LlamaFactory",
    "eval/hipho/official_impl",
]

[lint]
# pycodestyle errors, pyflakes, and import sorting.
select = ["E4", "E7", "E9", "F", "I"]

# The data generators are written in a deliberately compact style: short
# one-line guards and grouped assignments keep a walk's filter chain readable
# as a single block. These rules object to that style rather than to defects.
ignore = ["E701", "E702", "E731", "E741", "E401"]
