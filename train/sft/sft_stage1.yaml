# SFT stage 1: train from the base model on the stage-1 trajectories.
#
# Scale by changing tensor_model_parallel_size: expert_model_parallel_size must
# divide DP * TP, where DP = world_size / (TP * PP). See README.md.

### Model
model_name_or_path: ./models/base
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: full
use_mca: true
freeze_vision_tower: true      # the data is text-only

### Data: one conversation per line
dataset: stage1
dataset_dir: ./data
template: qwen3_5              # reasoning template, keeps <think>
cutoff_len: 98304
packing: false
preprocessing_num_workers: 16
# enable_thinking defaults to true; setting it false strips every <think>
# mask_history defaults to false; setting it true trains only the last turn

### Output
output_dir: ./saves/sft-stage1
logging_steps: 1
save_strategy: epoch
save_steps: 1000000
save_total_limit: 3
plot_loss: true

### Training
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 3.0e-6
lr_scheduler_type: constant
bf16: true
calculate_per_token_loss: true

### Megatron parallelism
# sequence_parallel is required, not an optimisation: this model has a large
# vocabulary and cross-entropy materialises the logits in fp32, which does not
# fit on one device at this sequence length.
# Keep TP at 2: num_key_value_heads is 2, and a larger TP hits a defect in the
# attention output gate.
tensor_model_parallel_size: 2
pipeline_model_parallel_size: 1
expert_model_parallel_size: 8
expert_tensor_parallel_size: 1
sequence_parallel: true
use_distributed_optimizer: true
bias_activation_fusion: true
apply_rope_fusion: true
moe_grouped_gemm: true
moe_token_dispatcher_type: alltoall
moe_router_dtype: fp32
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1

### Optimizer offload
# Off: the expert optimizer state shards across DP * TP / EP ranks, which is
# enough here. Turn it on if it does not fit; it costs throughput.
optimizer_cpu_offload: false

# overlap_grad_reduce and overlap_param_gather are left off: this is a
# ConditionalGeneration model whose projector does not participate in training
# on every rank, which the overlap path does not support.
# context_parallel is left off: most layers are gated_delta_net, which requires
# context_parallel_size == 1.
