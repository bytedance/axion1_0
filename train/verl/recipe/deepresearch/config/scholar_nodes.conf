# Scholar service hot-reload config (re-read on every scholar call).
# Edit this file at runtime to switch the scholar service URL without restart.
#
# Format:
#   url=http://hostname:port
#
# You can also set SCHOLAR_NODES_CONF env var to point to a different file,
# or SCHOLAR_SERVICE_URL env var / tools.yaml scholar_service_url for a static URL.

# WARNING: this file is on shared NAS and is read LIVE by EVERY node of EVERY
# concurrent run (35B + 4B share this exact path). Do NOT edit it to fix one run while
# another is live — you will hijack them all. The proper multi-node fix is per-run:
# services bind :: (see run_scholar_service.sh) + the launcher points SCHOLAR_NODES_CONF
# at a per-run generated conf carrying that run's real head URL. Until every running
# service is rebound to ::, this MUST stay 127.0.0.1 (the only address a 0.0.0.0-bound
# service actually serves), or head-node scholar calls on the running jobs break too.
url=http://127.0.0.1:8001
